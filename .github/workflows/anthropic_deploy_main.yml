name: Anthropic - Build & Deploy develop

# Internal deploy pipeline for this org's own hosted instance. Deliberately
# separate from Zealot upstream's own publish_release.yml / publish_nighty.yml
# / publish_preview.yml, which this fork still carries and which serve the
# public project (Docker Hub + GHCR images tagged by git tag / develop /
# release branches for anyone self-hosting Zealot). Those are untouched by
# this workflow and should stay that way. This one is purely "our own
# develop branch -> our own GHCR image -> our own Render service", triggered
# on the branch this org actually works on (develop is the default branch).
#
# What this does NOT do:
#   - It builds linux/amd64 only, not the multi-arch (amd64+arm64) builds
#     upstream's release/nightly workflows produce. Render's compute is
#     x86_64-only, and multi-arch buildx (QEMU-emulated arm64) roughly
#     doubles this job's build time for an architecture nothing here will
#     ever run on. Worth revisiting only if this image is ever pulled
#     somewhere non-x86_64.
#   - It does not itself prove the deploy succeeded end-to-end (Render
#     actually serving traffic, migrations having run, etc.) -- that needs
#     an operator with real Render access to confirm.

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "**.md"
      - ".devcontainer/**"
      - ".vscode/**"
      - "LICENSE"

concurrency:
  # Only one in-flight deploy of develop at a time; a newer push supersedes
  # an older one still building rather than racing it to Render.
  group: anthropic-deploy-develop
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image_ref.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Docker Build Date
        id: build_date
        run: echo "BUILD_DATE_TAG=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=deploy-latest
            type=sha,prefix=deploy-,format=short

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REPLACE_CHINA_MIRROR=false
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.BUILD_DATE_TAG }}

      # The exact, immutable tag Render is told to pull -- a floating tag
      # like `deploy-latest` would work for "what to pull" but gives a
      # weaker audit trail (which git commit is actually live). Using the
      # short-sha tag here means the Render deploy log and this workflow
      # run both point at the same unambiguous image.
      #
      # Lowercased explicitly: docker/metadata-action normalizes
      # ${{ github.repository }} to lowercase in its own outputs (used
      # above for the actual push), but this step builds the reference by
      # hand and github.repository itself is case-preserved
      # ("Zapier-codes/zealot") -- GHCR (like all OCI registries) rejects
      # uppercase repository names, so skipping this would silently
      # produce a reference that 404s against the image actually pushed.
      - name: Compute image reference for this commit
        id: image_ref
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "value=ghcr.io/${REPO_LOWER}:deploy-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Trigger Render deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Requires a `RENDER_DEPLOY_HOOK_URL` repo secret (Render dashboard ->
      # zealot-web service -> Settings -> Deploy Hook). This is an operator
      # setup step -- Render also needs a Container Registry credential
      # configured (or the GHCR package made public) before it can actually
      # pull a private ghcr.io image.
      - name: Trigger Render deploy of the image just pushed
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          IMG_URL_ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "${{ needs.build-and-push.outputs.image_ref }}")
          curl --fail --silent --show-error \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}&imgURL=${IMG_URL_ENCODED}"
          # A 200 here only means Render *accepted* the deploy request, not
          # that the deploy finished or the app is healthy -- this
          # workflow does not poll Render's API for deploy status.
