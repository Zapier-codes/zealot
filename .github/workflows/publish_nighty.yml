name: Publish Nightly Docker Image

# Anthropic (org note): MANUAL ONLY. Run it from Actions -> "Publish
# Nightly Docker Image" -> "Run workflow" if you ever genuinely want a
# `nightly` image.
#
# It used to trigger on every push to develop, in parallel with
# anthropic_deploy_main.yml ("Anthropic - Build & Deploy develop"), which
# is the ONLY pipeline that deploys this org's app to Render. Both started
# in the same second on every push, and this one -- a single-job, ~5 min,
# multi-arch (amd64+arm64 via QEMU) build titled "Push Docker image to
# multiple registries" -- kept listing ABOVE the real pipeline in the
# Actions tab, so the operator repeatedly opened it believing it was the
# deploy. Nothing consumes the `nightly` tag it publishes (render.yaml
# pulls `deploy-*` tags; fly.toml points at upstream's tryzealot image),
# and its slow arm64 build competed with the real deploy build for runner
# capacity.
#
# DO NOT add `push:` back under `on:`. See handover.md, "Which workflow is
# the deploy pipeline?".
on:
  workflow_dispatch:

env:
  DOCKER_TAG: nightly

jobs:
  push_to_registry:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    # Ensure only one job runs at a time
    concurrency:
      group: push_to_registry
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get build date
        id: build_date
        run: |
          echo "BUILD_DATE_TAG=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          # Anthropic (org note): this originally also pushed to plain
          # Docker Hub (`${{ github.repository }}`, no registry prefix),
          # but there's no Docker Hub account/credentials set up for this
          # org's fork — only a `Login to GitHub Container Registry` step
          # above, nothing logging into docker.io. That mismatch is what
          # was failing (401 "access token has insufficient scopes" — in
          # reality, no token at all for that registry). GHCR-only matches
          # what anthropic_deploy_main.yml already does correctly. Revisit
          # if this org ever does want to publish to Docker Hub too — that
          # needs its own docker/login-action step and a DOCKERHUB_TOKEN
          # secret, not just re-adding the image target back.
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.DOCKER_TAG }}
            type=raw,value=${{ env.DOCKER_TAG }}-${{ steps.build_date.outputs.BUILD_DATE_TAG }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            REPLACE_CHINA_MIRROR=false
            VCS_REF=${{ github.sha }}
            TAG=${{ env.DOCKER_TAG }}
            BUILD_DATE=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.created'] }}
