name: Test Docker Build

# Anthropic (org note): this was briefly changed to also trigger on
# push to develop (see git history), on the theory that this org's
# real workflow -- patches git am'd and pushed straight to develop,
# never through a PR (see handover.md's "Handoff process") -- meant
# the pull_request-only trigger never actually ran for a real push.
# Reverted: `develop` already gets THREE docker builds on every single
# push (anthropic_deploy_main.yml's real build+deploy,
# publish_nighty.yml, and publish_codespace.yml -- all three already
# trigger on push:develop, pre-dating this file's change; NOTE:
# publish_nighty.yml has since been made manual-only, so it is now two,
# and publish_codespace.yml only fires when dependency files change). Adding a
# 4th -- and the slowest one, since this workflow builds both amd64
# AND arm64 via QEMU emulation -- competed with those for shared
# runner capacity and measurably delayed/disrupted the org's actual
# deploy-to-Render pipeline (anthropic_deploy_main.yml's `deploy` job
# needs `build-and-push` to finish first; a starved/delayed build job
# means a starved/delayed deploy). The protection this was meant to
# add was marginal anyway -- anthropic_deploy_main.yml's own
# `needs: build-and-push` already stops a broken build from ever
# reaching Render, fail-closed, with no extra workflow required. Back
# to pull_request-only.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".devcontainer"
      - ".vscode"
      - "LICENSE"
      - "Procfile*"
      - "*.yaml"
      - "*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Docker Build Date
        id: build_date
        run: echo "BUILD_DATE_TAG=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Test build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          labels: ${{ steps.metadata.outputs.labels }}
          tags: |
            ${{ steps.metadata.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            REPLACE_CHINA_MIRROR=false
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.BUILD_DATE_TAG }}
