name: Test Docker Build

# Anthropic (org note): this used to be pull_request-only, but this org's
# actual workflow (see handover.md's "Handoff process") is sessions handing
# off patches that get `git am`'d and pushed straight to `develop` -- no
# PRs, ever. A pull_request-only trigger meant this dry-run build check
# never actually ran for this org's real push pattern, so a
# package.json/pnpm-lock.yaml mismatch (or any other Dockerfile-breaking
# change) could reach `develop` -- and anthropic_deploy_main.yml's real
# build-and-push job -- with zero prior warning. Added a `push: develop`
# trigger below so this now runs on every push to develop too, same as
# the real deploy workflow, `push: false` so it never actually publishes
# anything -- it only proves the Dockerfile still builds.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".devcontainer"
      - ".vscode"
      - "LICENSE"
      - "Procfile*"
      - "*.yaml"
      - "*.yml"
  push:
    branches:
      - develop
    paths-ignore:
      - "**.md"
      - ".devcontainer/**"
      - ".vscode/**"
      - "LICENSE"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Docker Build Date
        id: build_date
        run: echo "BUILD_DATE_TAG=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Test build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          labels: ${{ steps.metadata.outputs.labels }}
          tags: |
            ${{ steps.metadata.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            REPLACE_CHINA_MIRROR=false
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.BUILD_DATE_TAG }}
