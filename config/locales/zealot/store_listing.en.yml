en:
  activerecord:
    errors:
      models:
        publisher_profile:
          attributes:
            kind:
              locked_once_live: cannot be changed while one of your apps is live on the store
  simple_form:
    labels:
      publisher_profile:
        kind: I am publishing as
        display_name: Public name
        legal_name: Full legal name
        country: Country
        contact_email: Contact email
    hints:
      publisher_profile:
        kind: Choose Company if you publish on behalf of a business.
        display_name: The name store visitors see as the publisher, unless the app has its own publisher name.
        legal_name: Your full legal name, or the registered name of your company. Not shown publicly.
        country: Where you or your company are based. Not shown publicly.
        contact_email: Where we reach you about your apps. Not shown publicly.
  publisher_profiles:
    kinds:
      individual: Individual
      company: Company
    new:
      title: How do you publish?
      intro: Tell us whether you publish as an individual or as a company. You only do this once; it is reused for all your apps.
    create:
      notice: Publisher details saved.
    edit:
      title: Publisher details
    update:
      notice: Publisher details updated.
  apps:
    listing_graphics:
      create:
        added:
          screenshot: Screenshot added.
          feature_graphic: Feature graphic set.
        no_file: Choose an image to upload.
        refused: "The image was not added: %{reasons}."
        storage_failed: The image could not be stored. Nothing was saved; please try again in a moment.
      destroy:
        notice: Graphic removed.
      update:
        notice: Description saved.
        refused: "The description was not saved: %{reasons}."
      move:
        moved: Screenshot moved.
        unchanged: The screenshot is already there.
        bad_direction: Choose whether to move the screenshot earlier or later.
    promo_videos:
      update:
        saved: Promo video saved.
        removed: Promo video removed.
        refused: "The promo video was not saved: %{reasons}."
        errors:
          not_a_url: That is not a web link. Paste the video's YouTube link.
          other_host: Only YouTube links are accepted.
          playlist: That link is a playlist. Paste the link to a single video instead.
          not_a_video: That YouTube link is not a single video. Paste the link to the video itself.
    listing_texts:
      show:
        title: Store listing text
        card_title: Name and descriptions
        intro: Edit the name and the descriptions store visitors read. Saving keeps your changes as a draft; nothing on the store changes yet.
        draft_notice: "You have an unpublished draft that changes: %{fields}."
        live_now: "Live now: %{text}"
        empty: none
        save: Save draft
        back: Back to the app
        publish_hint: "Publish writes your draft to the listing now. Discard throws the draft away and keeps the listing as it is."
        publish: Publish draft
        discard: Discard draft
        confirm_publish: Publish this draft to the store listing?
        confirm_discard: Discard this draft? Your unpublished changes will be lost.
        fields:
          name: Name
          short_description: Short description
          description: Full description
        hints:
          name: The app's name.
          short_description: "One line, up to %{max_short} characters. Line breaks become spaces."
          description: "Plain text, up to %{max_full} characters. Blank lines separate paragraphs; links and formatting are not applied."
        advice:
          note: The wording check reads English only. It is advice; it never stops you from saving or publishing.
          title: Wording advice
          warnings:
            too_long: "Google Play limits titles to %{limit} characters; this name has %{count}."
            emoji: "Google Play's metadata policy discourages emoji and emoticons here: %{match}."
            repeated_punctuation: "Google Play's metadata policy discourages repeated punctuation: %{match}."
            all_caps_word: "Google Play allows ALL-CAPS words only for a brand name: %{match}."
            performance: "Google Play's metadata policy discourages performance and ranking claims: %{match}."
            deal: "Google Play's metadata policy discourages price and promotion wording: %{match}."
            call_to_action: "Google Play's metadata policy discourages calls to action: %{match}."
            all_caps_run: "Runs of ALL-CAPS words read as shouting: %{match}."
            many_emoji: "This text has %{count} emoji. Google Play discourages excessive emoji; more than %{limit} is flagged here."
            keyword_stuffing: "This text may repeat keywords too often: %{match} (the most used appears %{count} times). Google Play discourages keyword stuffing."
      update:
        saved: Draft saved. It is not on the store yet.
        unchanged: Nothing was changed.
        refused: "The text was not saved: %{reasons}."
      commit:
        published: Draft published. The listing now shows your text.
        nothing: There is no draft to publish.
        nothing_staged: The draft had no changes, so there was nothing to publish.
        refused: "The draft was not published: %{reasons}."
        unknown: the listing could not be updated
      destroy:
        discarded: Draft discarded. The listing was not changed.
        nothing: There is no draft to discard.
    listing_translations:
      show:
        title: Listing translations
        card_title: Machine translation
        intro: Translate the store listing's name and descriptions into other languages. A machine translation is stored as a draft and only published on the store once you approve it; editing the original text later marks a translation as out of date.
        source_note: "The listing is authored in %{source}; translations are made from that text."
        disabled_note: Machine translation is off. Set ZEALOT_TRANSLATE_URL to a LibreTranslate or Argos server to turn it on.
        locales_label: Target languages
        locales_placeholder: "de, fr, pt-BR"
        locales_hint: Comma-separated language codes.
        translate: Translate
        stored_title: Stored translations
        none_stored: No translations yet.
        source_card_title: Source text (English)
        empty: Nothing written yet.
        columns:
          locale: Language
          state: State
          short_description: Short description
          actions: Actions
        states:
          machine: Machine — needs review
          reviewed: Approved
          stale: Out of date
        approve: Approve
        discard: Discard
      translate:
        disabled: Machine translation is off. Set ZEALOT_TRANSLATE_URL and try again.
        no_locales: Choose at least one target language.
        done: "Translated: %{locales}."
        failed: "Nothing was translated: %{reasons}"
        partial: "Translated %{locales}, but some failed: %{reasons}"
        none: Nothing new was translated.
      review:
        approved: "Approved the %{locale} translation. It will appear on the store."
        approve_failed: "The %{locale} translation could not be approved — it may be out of date. Re-translate it first."
      destroy:
        discarded: "Discarded the %{locale} translation."
        missing: "There is no %{locale} translation to discard."
    app_contents:
      show:
        title: App content
        card_title: Content and declarations
        intro: Declare the content rating, the data your app collects and the store flags. Saving keeps your changes as a draft; nothing on the store changes until you publish. Play shows these on the store listing's "Data safety" and "About this app" sections.
        data_safety_title: Data safety
        flags_title: Store declarations
        policy_title: Privacy policy
        availability_title: Country availability
        availability_note: "Leave every country unticked to offer the app everywhere. Tick countries to restrict the store listing's availability; a reader uses this only to warn a visitor, not to block the download."
        reviewer_title: Reviewer access
        reviewer_note: "Only your team and Zealot see this. It is never published to the store or the signed catalog index. Give Google's reviewers an account to sign in with, if your app needs one."
        reviewer_saved: Reviewer access saved.
        crash_reporting_title: Crash reporting
        crash_reporting_note: "Off by default, and never published. When on, a build holding the vitals-scoped API token may send crashes and ANRs here, where the Crashes and ANRs page groups them. Only the message, the stack trace and the build and device are stored."
        crash_reporting_label: Accept crash and ANR reports from this app
        draft_notice: "You have an unpublished draft that changes: %{fields}."
        live_now: "Live now: %{text}"
        empty: none
        save: Save draft
        back: Back to the app
        publish_hint: "Publish writes your draft to the listing now. Discard throws the draft away and keeps the listing as it is."
        publish: Publish draft
        discard: Discard draft
        confirm_publish: Publish this draft to the store listing?
        confirm_discard: Discard this draft? Your unpublished changes will be lost.
        bounded_by: "Applied to everyone in this range and below: %{rating}."
        fields:
          content_rating: Content rating
          data_safety_collects: Collects or shares user data
          data_safety_types: Data types collected
          data_safety_shared: Shared with third parties
          data_safety_encrypted: Encrypted in transit
          data_safety_deletion_url: Data deletion request URL
          contains_ads: Contains ads
          has_in_app_purchases: In-app purchases
          privacy_policy_url: Privacy policy URL
          reviewer_access_instructions: Reviewer access instructions
        hints:
          content_rating: The age rating Play would show for this app. Leaving it Unrated is allowed; the clients will not filter by a rating you have not set.
          data_safety_collects: Answer "No" only if the app collects nothing at all.
          data_safety_types: Select every category the app collects or shares.
          data_safety_shared: Whether any collected data leaves to a third party.
          data_safety_encrypted: Whether data is encrypted in transit (TLS).
          data_safety_deletion_url: A page where a person can ask for their data to be deleted. Optional.
          contains_ads: Whether the app shows ads.
          has_in_app_purchases: Whether the app sells digital goods inside it.
          privacy_policy_url: The public page that explains your privacy practices. Required by Play for most apps.
          reviewer_access_instructions: Sign-in details or steps a reviewer needs to test the app.
        choices:
          unknown: "Not answered"
          yes: "Yes"
          no: "No"
      update:
        saved: Draft saved. It is not on the store yet.
        unchanged: Nothing was changed.
        refused: "The content was not saved: %{reasons}."
      commit:
        published: Draft published. The listing now shows these declarations.
        nothing: There is no draft to publish.
        nothing_staged: The draft had no changes, so there was nothing to publish.
        refused: "The draft was not published: %{reasons}."
        unknown: the listing could not be updated
      destroy:
        discarded: Draft discarded. The listing was not changed.
        nothing: There is no draft to discard.
    reviews:
      index:
        title: Reviews
        card_title: Inbox
        intro: Read what people say about the app and reply as the developer. A reply is public as soon as you save it. Leaving the box empty clears a reply.
        average: "Average rating: %{rating}"
        count: "%{count} reviews"
        replied: "%{count} replied"
        stars: "%{count}★"
        helpful: "%{count} found this helpful"
        empty: No reviews yet.
        reply_label: "Developer reply · %{when}"
        ago: ago
        ago_unknown: earlier
        reply_placeholder: Write a reply (up to 350 characters)
        reply_save: Reply
        reply_update: Update reply
        reply_clear_hint: Empty the box and save to remove the reply.
        back: Back to the app
      update:
        saved: Reply saved.
        refused: "The reply was not saved: %{reasons}."
    anonymous_reviews:
      index:
        title: Anonymous reviews
        pending_title: Held for review
        intro: "These reviews were held automatically because they may be spam (a link, a contact address, or several signals together). Publish one to make it public, or reject it to keep it out. Anonymous reviews carry no account and no identity."
        empty_pending: Nothing is waiting — every review was published automatically.
        published_title: Recently published
        empty_published: No published anonymous reviews yet.
        rejected_count: "%{count} rejected"
        stars: "%{count}★"
        verified: Verified install
        flagged: "Held for: %{reason}"
        publish: Publish
        reject: Reject
      publish:
        published: Review published.
      reject:
        rejected: Review rejected.
    policy_statuses:
      show:
        title: Policy status
        card_title: Automated review
        intro: Every release is checked automatically — its declared permissions, target API, signing and the third-party SDKs found by the scanner. This is the machine verdict a person would otherwise have to read the build to reach. A flag or a reject is information, not a block; nothing here removes a release from your distribution.
        checked: "Checked %{when} ago"
        tally: "%{verdict}: %{count}"
        empty: No release has been checked yet. The check runs when a release is uploaded.
        clean: No issues found by the automated checks.
        trackers_title: Third-party SDKs / trackers found
        back: Back to the app
        status:
          running: Checking…
          failed: The check could not run
        verdict:
          pass: Passed
          flag: Needs a look
          reject: Rejected
        pre_launch:
          card_title: Pre-launch report
          intro: Your build is installed on a device and driven automatically — launched, then hammered with monkey events — and any crash, ANR, exception or startup problem is reported here before a person looks. A crash is a reject; the other findings are flags. Nothing here blocks distribution.
          clean: The app ran on the devices without a crash, ANR, exception or startup problem.
          ran: "Ran %{when} ago"
          findings_title: What the run saw
          summary: "Run: %{summary}"
          status:
            running: Running on a device…
            failed: The run could not complete
          verdict:
            pass: No problems
            flag: Needs a look
            reject: Crashed
    show:
      store_listing: Store listing
      listing_text: Store listing text
      app_content: App content
      listing_translations: Listing translations
      reviews: Reviews
      anonymous_reviews: Anonymous reviews
      policy_status: Policy status
      deep_link_verification: Deep link verification
      # Z-P22: the deep-link verification checker page.
    deep_link_verifications:
      title: Deep link verification
      show:
        card_title: App Links
        intro: "An https App Link is verified by the site serving /.well-known/assetlinks.json. This reads the hosts your deep links declare and checks, for each one, whether that file names this app's package and signing certificate. Nothing here changes your site."
        package: "Package: %{value}"
        certificate: "Signing certificate: %{value}"
        present: found
        missing: not found
        host: Host
        status: Status
        recheck: Re-check
        no_hosts: No host is declared by this app's deep links, so there is nothing to check.
        blocked:
          no_package: "No package name: set the app's package name or upload an Android release first."
          no_certificate: "No signing certificate on file: upload an Android release so its certificate is read."
          no_hosts: "No declared host to check."
        state:
          verified: Verified
          not_associated: Not associated
          unreachable: Unreachable
          invalid: Invalid file
          no_certificate: No certificate
          not_checked: Not checked
      listing_graphics:
        title: Store graphics
        intro: These are the screenshots and feature graphic store visitors see. Changes reach the store the next time the catalog is published.
        checklist:
          title: Play checklist
          summary: "%{met} of %{total} done"
          done: Done.
          todo: Not done yet.
          progress: "(%{count} of %{target})"
          hint: These are Google Play's recommendations. They are advice only; nothing here stops you from publishing.
          items:
            min_screenshots: At least 2 screenshots (Play needs 2 to publish)
            promo_screenshots: 4 or more screenshots of 1080 px or more, 16:9 or 9:16 (recommended for store promotion)
            feature_graphic: A feature graphic (1024 x 500 px)
            alt_text: A description on every graphic
            video: A promo video
        screenshots: Screenshots
        screenshots_used: "%{used} of %{max} screenshots"
        no_screenshots: No screenshots yet. Two or more are recommended.
        feature_graphic: Feature graphic
        no_feature_graphic: No feature graphic yet.
        position: "Screenshot %{number}"
        size: "%{width} x %{height} px"
        no_alt_text: No description
        not_stored: Not stored yet
        remove: Remove
        save: Save
        move_earlier: Earlier
        move_later: Later
        confirm_remove: Remove this graphic from the store listing?
        add_title: Add a graphic
        kind: Kind
        kinds:
          screenshot: Screenshot
          feature_graphic: Feature graphic
        file: Image file
        alt_text: Description
        alt_placeholder: "Describe the image (up to %{max} characters)"
        add: Add
        video:
          title: Promo video
          none: No promo video.
          placeholder: Paste a YouTube link
          save: Save
          remove: Remove video
          confirm_remove: Remove the promo video from the store listing?
          hint: A single YouTube video link. It must be public or unlisted; Zealot cannot check that, or whether embedding is allowed. Playlists, channels and timestamps are not kept, only the video itself.
        rules: "JPEG or PNG without transparency, up to %{max_mb} MB. Screenshots: each side %{min} to %{max_side} px, at most %{max_shots}. Feature graphic: exactly %{feature_w} x %{feature_h} px; a new one replaces the old."
    store_listings:
      status:
        draft: Not on the store
        awaiting_payment: Awaiting payment
        live: Live on the store
        suspended: Suspended
      show:
        title: Store listing
        status_title: Status
        publisher: "Publishing as %{name} (%{kind})."
        edit_publisher: Edit publisher details
        publish: Publish to the store
        pay: Pay $14.99 to publish
        mark_paid: Mark as paid
        incomplete:
          title: Add the store pictures first
          body: "Publishing needs an icon and at least 2 screenshots. Missing: %{missing}."
          graphics_link: Open the store graphics panel
          icon_hint: The icon comes from your latest release. If it has none, set one with PUT /api/apps/<id>/listing_icon (a 512 x 512 PNG), then reload this page.
        mark_paid_hint: Payments are not connected yet. Until they are, an admin can record the payment by hand, which puts the app live.
        draft:
          body: This app is not on the store yet. Publishing puts it in front of store visitors under your publisher details.
        awaiting_payment:
          body: Your request is saved. The app goes live as soon as payment is received.
        live:
          body: This app is live on the store.
          shown_as: "Visitors see it published by %{name}."
        suspended:
          body: This app is suspended and hidden from the store.
      missing:
        icon: "no icon"
        screenshots: "%{count} of %{target} screenshots"
      create:
        need_profile: First tell us how you publish, as an individual or as a company.
        requested: Publishing requested. The app goes live once payment is received.
        not_available: This app can't be sent for payment right now.
        incomplete: "Add an icon and at least 2 screenshots to this app's listing before publishing. Missing: %{missing}."
      pay:
        title: Starting payment
        pay_button: Pay $14.99
        not_configured: Payment isn't fully set up yet (missing the checkout publishable key or web client URL). Contact an admin.
        not_finished: The app goes live automatically once B-PAY confirms the charge — this can take a few seconds after payment.
        back: Back to store listing
        not_available: This app isn't waiting for payment.
        incomplete: "Add an icon and at least 2 screenshots to this app's listing before paying. Missing: %{missing}."
        payment_start_failed: Couldn't start payment right now. Please try again shortly.
        status:
          succeeded: Payment succeeded! This page will update once the app is live.
          processing: Your payment is processing.
          requires_payment_method: Your payment wasn't successful — please try again.
          unknown: Something went wrong. Please try again or contact support.
      mark_paid:
        notice: Marked as paid. The app is now live on the store.
        not_available: This app isn't waiting for payment.

  revenues:
    show:
      title: Revenue
      earnings_title: Earnings
      earnings_label: Total earned
      payments_label: Payments
      paid_out_label: Paid out
      outstanding_label: Available to pay out
      by_period_title: By month
      by_app_title: By app
      by_purpose_title: By type
      purpose_line: "%{purpose}: %{amount} (%{count})"
      purpose:
        listing_fee: Listing fee
        maintenance: Maintenance
      period: Month
      app: App
      amount: Amount
      count: Count
      no_earnings: No payment has succeeded yet, so there is nothing to report.
      payouts_title: Payouts
      not_configured: Payouts aren't configured on this instance yet (B-Pay-backend's key is not set). The report above is still accurate.
      amount_label: Amount (USD)
      connector_label: Connector
      method_label: Payout method ID (optional)
      request_payout: Request payout
      payout_hint: The connector is which payment provider pays out (for example adyen). The payout method is the destination you set up with B-Pay; Zealot never stores your bank details.
      need_profile: Create a publisher profile before you can receive payouts.
      when: When
      status: Status
      cancel: Cancel
      refresh: Refresh
      no_payouts: No payout has been requested yet.
      status:
        created: Created
        requires_confirmation: Needs confirmation
        initiated: Initiated
        pending: Pending
        succeeded: Succeeded
        failed: Failed
        cancelled: Cancelled
      back: Back to the dashboard

  payouts:
    create:
      created: Payout requested.
      need_profile: Create a publisher profile before you can receive payouts.
      not_configured: Payouts aren't configured on this instance yet.
      bad_amount: Enter a payout amount greater than zero.
      need_connector: Choose a connector for the payout.
      failed: "The payout could not be started: %{reason}"
    cancel:
      cancelled: Payout cancelled.
      already: This payout is already cancelled.
      failed: "The payout could not be cancelled: %{reason}"
    refresh:
      refreshed: Payout status refreshed.
      failed: "The payout status could not be read: %{reason}"
    missing: That payout could not be found.
