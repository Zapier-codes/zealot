en:
  activerecord:
    errors:
      models:
        publisher_profile:
          attributes:
            kind:
              locked_once_live: cannot be changed while one of your apps is live on the store
  simple_form:
    labels:
      publisher_profile:
        kind: I am publishing as
        display_name: Public name
        legal_name: Full legal name
        country: Country
        contact_email: Contact email
    hints:
      publisher_profile:
        kind: Choose Company if you publish on behalf of a business.
        display_name: The name store visitors see as the publisher, unless the app has its own publisher name.
        legal_name: Your full legal name, or the registered name of your company. Not shown publicly.
        country: Where you or your company are based. Not shown publicly.
        contact_email: Where we reach you about your apps. Not shown publicly.
  publisher_profiles:
    kinds:
      individual: Individual
      company: Company
    new:
      title: How do you publish?
      intro: Tell us whether you publish as an individual or as a company. You only do this once; it is reused for all your apps.
    create:
      notice: Publisher details saved.
    edit:
      title: Publisher details
    update:
      notice: Publisher details updated.
  apps:
    listing_graphics:
      create:
        added:
          screenshot: Screenshot added.
          feature_graphic: Feature graphic set.
        no_file: Choose an image to upload.
        refused: "The image was not added: %{reasons}."
        storage_failed: The image could not be stored. Nothing was saved; please try again in a moment.
      destroy:
        notice: Graphic removed.
      update:
        notice: Description saved.
        refused: "The description was not saved: %{reasons}."
      move:
        moved: Screenshot moved.
        unchanged: The screenshot is already there.
        bad_direction: Choose whether to move the screenshot earlier or later.
    promo_videos:
      update:
        saved: Promo video saved.
        removed: Promo video removed.
        refused: "The promo video was not saved: %{reasons}."
        errors:
          not_a_url: That is not a web link. Paste the video's YouTube link.
          other_host: Only YouTube links are accepted.
          playlist: That link is a playlist. Paste the link to a single video instead.
          not_a_video: That YouTube link is not a single video. Paste the link to the video itself.
    show:
      store_listing: Store listing
      listing_graphics:
        title: Store graphics
        intro: These are the screenshots and feature graphic store visitors see. Changes reach the store the next time the catalog is published.
        screenshots: Screenshots
        screenshots_used: "%{used} of %{max} screenshots"
        no_screenshots: No screenshots yet. Two or more are recommended.
        feature_graphic: Feature graphic
        no_feature_graphic: No feature graphic yet.
        position: "Screenshot %{number}"
        size: "%{width} x %{height} px"
        no_alt_text: No description
        not_stored: Not stored yet
        remove: Remove
        save: Save
        move_earlier: Earlier
        move_later: Later
        confirm_remove: Remove this graphic from the store listing?
        add_title: Add a graphic
        kind: Kind
        kinds:
          screenshot: Screenshot
          feature_graphic: Feature graphic
        file: Image file
        alt_text: Description
        alt_placeholder: "Describe the image (up to %{max} characters)"
        add: Add
        video:
          title: Promo video
          none: No promo video.
          placeholder: Paste a YouTube link
          save: Save
          remove: Remove video
          confirm_remove: Remove the promo video from the store listing?
          hint: A single YouTube video link. It must be public or unlisted; Zealot cannot check that, or whether embedding is allowed. Playlists, channels and timestamps are not kept, only the video itself.
        rules: "JPEG or PNG without transparency, up to %{max_mb} MB. Screenshots: each side %{min} to %{max_side} px, at most %{max_shots}. Feature graphic: exactly %{feature_w} x %{feature_h} px; a new one replaces the old."
    store_listings:
      status:
        draft: Not on the store
        awaiting_payment: Awaiting payment
        live: Live on the store
        suspended: Suspended
      show:
        title: Store listing
        status_title: Status
        publisher: "Publishing as %{name} (%{kind})."
        edit_publisher: Edit publisher details
        publish: Publish to the store
        pay: Pay $14.99 to publish
        mark_paid: Mark as paid
        mark_paid_hint: Payments are not connected yet. Until they are, an admin can record the payment by hand, which puts the app live.
        draft:
          body: This app is not on the store yet. Publishing puts it in front of store visitors under your publisher details.
        awaiting_payment:
          body: Your request is saved. The app goes live as soon as payment is received.
        live:
          body: This app is live on the store.
          shown_as: "Visitors see it published by %{name}."
        suspended:
          body: This app is suspended and hidden from the store.
      create:
        need_profile: First tell us how you publish, as an individual or as a company.
        requested: Publishing requested. The app goes live once payment is received.
        not_available: This app can't be sent for payment right now.
      pay:
        title: Starting payment
        pay_button: Pay $14.99
        not_configured: Payment isn't fully set up yet (missing the checkout publishable key or web client URL). Contact an admin.
        not_finished: The app goes live automatically once B-PAY confirms the charge — this can take a few seconds after payment.
        back: Back to store listing
        not_available: This app isn't waiting for payment.
        payment_start_failed: Couldn't start payment right now. Please try again shortly.
        status:
          succeeded: Payment succeeded! This page will update once the app is live.
          processing: Your payment is processing.
          requires_payment_method: Your payment wasn't successful — please try again.
          unknown: Something went wrong. Please try again or contact support.
      mark_paid:
        notice: Marked as paid. The app is now live on the store.
        not_available: This app isn't waiting for payment.
