<!doctype html>
<!-- Z-P23 (Play Console parity): the offline page the console's service worker falls back to when a
     navigation has no network. Static, self-contained, no data — it can never show anything stale. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      h1 { font-size: 1.25rem; margin: 0; }
      p { margin: 0; opacity: 0.7; max-width: 32rem; }
    </style>
  </head>
  <body>
    <h1>You are offline</h1>
    <p>This page needs a connection. Reconnect and try again — the console works exactly as before.</p>
  </body>
</html>
