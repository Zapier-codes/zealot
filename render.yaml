services:
- type: web
  name: zealot-web
  # Anthropic (handover.md task #8): switched from `env: docker` (Render
  # builds the Dockerfile itself on every push) to `runtime: image` (Render
  # pulls a prebuilt image instead). The actual build now happens in
  # .github/workflows/anthropic_deploy_main.yml, which pushes to GHCR and
  # then calls this service's deploy hook — see that workflow for why.
  # `image.url` below is only the *default* image (what a manual
  # dashboard "Deploy latest reference" or an unparameterized deploy-hook
  # call would pull); the deploy-hook workflow overrides it per-deploy
  # with an immutable `imgURL=...deploy-<sha>` so the image Render runs
  # always matches an exact commit.
  #
  # NOTE this changes the service's runtime type. Per Render's own docs,
  # switching an *existing* service between `docker` and `image` runtime
  # via a Blueprint re-sync is not guaranteed to apply in place — this may
  # require deleting and recreating the service in the Render dashboard
  # rather than a simple `render blueprint deploy`. Not something this
  # sandbox session can verify; flagging so the operator checks the sync
  # result rather than assuming it took effect silently.
  #
  # No `creds:` block: this repo's GHCR package (ghcr.io/zapier-codes/zealot)
  # is public (confirmed by the operator), so Render can pull it
  # unauthenticated -- no Registry Credential needed. A prior version of
  # this file referenced `creds.fromRegistryCreds.name: ghcr-zealot`, a
  # credential that was never actually confirmed to exist in the Render
  # workspace ("placeholder name -- create the credential first" is what
  # the old comment literally said). A Blueprint pointing `creds` at a
  # nonexistent named credential can fail to resolve during sync/deploy --
  # GitHub Actions would still show green (it only calls the deploy hook
  # and gets a 200 back; it has no visibility into what Render does next),
  # while Render silently never actually updates the running image. That
  # exact "GitHub succeeded but Render didn't reflect it" symptom is what
  # led to removing this block. If GHCR ever goes private again, this
  # needs re-adding -- but only after confirming a Registry Credential
  # with that exact name genuinely exists under Render's Workspace
  # Settings -> Registry Credentials, not before.
  runtime: image
  image:
    # Lowercased: GHCR (like all OCI registries) rejects uppercase
    # repository names, and this repo's GitHub path has one
    # ("Zapier-codes/zealot") -- see anthropic_deploy_main.yml's own note
    # on the same issue where it computes the per-deploy imgURL override.
    url: ghcr.io/zapier-codes/zealot:deploy-latest
  plan: free
  region: singapore
  # autoDeploy has no effect on an image-backed service (Render does not
  # poll external registries for new images) -- left out deliberately
  # rather than kept as a no-op `true` that implies otherwise. Deploys are
  # driven entirely by the GitHub Actions workflow's deploy-hook call.
  # disk:
  #   name: zealot-data
  #   mountPath: /app/public/uploads
  #   sizeGB: 10
  envVars:
  - key: ZEALOT_ADMIN_EMAIL
    sync: false
  - key: ZEALOT_ADMIN_PASSWORD
    sync: false
  - key: ZEALOT_DOMAIN
    sync: false
  - key: DEFAULT_LOCALE
    sync: false
  - key: ZEALOT_GUEST_MODE
    value: false
  # Registration is currently enabled in production (confirmed live via
  # the Render API — this key isn't actually set on the service, so
  # Setting.registrations_enabled falls back to its default of `true`).
  # Declaring `value: false` here would silently disable sign-up again on
  # the next Blueprint re-sync, so this is `sync: false` to preserve
  # whatever's actually set in the dashboard instead.
  - key: ZEALOT_REGISTER_ENABLED
    sync: false

  - key: SMTP_ADDRESS
    value: false
  - key: SMTP_PORT
    value: false
  - key: SMTP_DOMAIN
    value: false
  - key: SMTP_USERNAME
    value: false
  - key: SMTP_PASSWORD
    value: false
  - key: SMTP_AUTH_METHOD
    value: false
  - key: SMTP_ENABLE_STARTTLS_AUTO
    value: false
  - key: ACTION_MAILER_DEFAULT_FROM
    value: false
  - key: ACTION_MAILER_DEFAULT_TO
    value: false

  # Task 16: Novu as the email delivery layer (see handover.md). `sync: false`
  # so a Blueprint re-sync never overwrites what is set in the dashboard.
  # NOVU_API_KEY = the Novu environment's Secret Key; while it is unset the
  # automated emails keep using SMTP.
  - key: NOVU_API_KEY
    sync: false
  - key: NOVU_API_URL
    sync: false
  - key: ZEALOT_EMAIL_PROVIDER
    sync: false

  - key: GOOGLE_OAUTH_ENABLED
    value: false
  - key: GOOGLE_CLIENT_ID
    value: false
  - key: GOOGLE_SECRET
    value: false

  - key: FEISHU_ENABLED
    value: false
  - key: FEISHU_APP_ID
    value: false
  - key: FEISHU_APP_SECRET
    value: false

  - key: GITLAB_ENABLED
    value: false
  - key: GITLAB_SITE
    value: false
  - key: GITLAB_SCOPE
    value: false
  - key: GITLAB_APP_ID
    value: false
  - key: GITLAB_SECRET
    value: false

  - key: LDAP_ENABLED
    value: false
  - key: LDAP_HOST
    value: false
  - key: LDAP_PORT
    value: false
  - key: LDAP_METHOD
    value: false
  - key: LDAP_BIND_DN
    value: false
  - key: LDAP_PASSWORD
    value: false
  - key: LDAP_BASE
    value: false
  - key: LDAP_UID
    value: false

  - key: GOOGLE_ANALYTICS_ID
    value: false

  # Database: Supabase Postgres (Session Pooler), not a Render-managed
  # database -- set directly in the Render dashboard, not synced from a
  # `databases:` block here, so a Blueprint re-sync never tries to
  # provision its own Postgres and overwrite this. Single connection
  # string (sslmode etc. are encoded in it); config/database.yml prefers
  # this over the ZEALOT_POSTGRES_* discrete vars when both are present.
  - key: ZEALOT_DATABASE_URL
    sync: false
  - key: PORT
    value: 80 # Do not edit! Zealot exposes this internally
  - key: RAILS_MAX_THREADS
    value: 1
  - key: WEB_CONCURRENCY
    value: 1
  - key: SECRET_TOKEN
    generateValue: true

  # Anthropic: OOM fix, phase 2 (see docker/rootfs/etc/services.d/zealot/run
  # and .../job/run for the actual toggle logic). Default false: GoodJob's
  # scheduler/cron runs embedded in the web (Puma) process instead of in a
  # second dedicated `bin/good_job` process, so this 512Mi instance isn't
  # paying for a duplicate Rails boot. Flip to true once this service has
  # more headroom (e.g. after moving off the free instance size to a
  # bigger plan) to go back to a separate worker process. This alone does
  # NOT provision a second Render service -- it just un-merges the two
  # processes within this one service/container. A genuinely separate,
  # independently-scaled worker service (its own memory ceiling) is a
  # further step on top of this, not yet set up here -- ask for it when
  # actually ready to pay for a second service.
  - key: ZEALOT_SEPARATE_WORKER
    value: false

  # Anthropic: OOM fix, phase 2 continued -- the other suspected OOM
  # contributor flagged in handover.md, untouched by the scheduler fix.
  # Caps ImageMagick's own memory/map/area use per operation so a single
  # CarrierWave variant-processing job can't balloon past what this
  # instance can afford. Conservative values for a 512Mi box; raise if
  # variant processing starts failing/timing out instead of OOMing.
  - key: MAGICK_MEMORY_LIMIT
    value: 128MiB
  - key: MAGICK_MAP_LIMIT
    value: 128MiB
  - key: MAGICK_AREA_LIMIT
    value: 64MP

# Anthropic: dedicated worker service, drafted for when you're on a paid
# plan and want the job worker fully isolated (its own memory ceiling,
# scalable independently of the web service) instead of just embedding it
# in zealot-web or un-merging the two processes within one bigger
# container. Render has no free instance for Background Worker/Private
# Service (only Web Services, Postgres, Redis are free) -- confirmed
# against Render's own docs/support, so this stays commented out until
# you're actually paying for it; a Blueprint sync ignores commented-out
# YAML, so this doesn't get provisioned by accident.
#
# To activate:
#   1. Uncomment this block.
#   2. On zealot-web above, set ZEALOT_SEPARATE_WORKER=true too --
#      otherwise BOTH this worker and zealot-web's embedded mode would
#      run the scheduler/cron, reintroducing the original duplicate-
#      scheduler OOM bug this whole fix started from.
#   3. `.github/workflows/anthropic_deploy_main.yml` currently only calls
#      zealot-web's deploy hook with the per-commit imgURL override --
#      it needs a second deploy-hook call added for zealot-worker (same
#      imgURL) so both services actually update together on every push,
#      not just zealot-web.
#   4. `render blueprint deploy` (or a dashboard Blueprint re-sync) to
#      actually create the service.
#
# - type: worker
#   name: zealot-worker
#   runtime: image
#   image:
#     url: ghcr.io/zapier-codes/zealot:deploy-latest
#   plan: starter  # cheapest plan with a Background Worker instance
#   region: singapore  # match zealot-web's region -- same private network,
#                      # and both need to reach the same Postgres/Supabase
#   envVars:
#   - key: ZEALOT_SEPARATE_WORKER
#     value: true
#   - key: ZEALOT_WORKER_ONLY
#     value: true  # skip Caddy + Puma in this container -- see
#                  # docker/rootfs/etc/services.d/{caddy,zealot}/run
#   - key: ZEALOT_DATABASE_URL
#     sync: false  # same Supabase connection string as zealot-web
#   - key: RELEASE_STORAGE_ADAPTER
#     value: github
#   - key: GITHUB_STORAGE_REPO
#     sync: false
#   - key: GITHUB_STORAGE_TOKEN
#     sync: false
#   - key: MAGICK_MEMORY_LIMIT
#     value: 128MiB
#   - key: MAGICK_MAP_LIMIT
#     value: 128MiB
#   - key: MAGICK_AREA_LIMIT
#     value: 64MP
#   - key: SECRET_TOKEN
#     sync: false  # must match zealot-web's -- copy the generated value
#                  # from the dashboard rather than generateValue: true
#                  # here, or the two services will disagree on it

  # Task 19: release files are stored as GitHub Release assets in a dedicated
  # PRIVATE storage repo (not this code repo), because Render's Free plan has
  # no persistent disk and every redeploy wipes /app/public/uploads. Unset,
  # ReleaseStorage now raises in production instead of silently using local
  # disk. Both secrets are `sync: false` so a Blueprint re-sync never touches
  # what is set in the dashboard. See handover.md Task 19 for the operator
  # steps (create the repo, create the token) that must happen BEFORE deploy.
  - key: RELEASE_STORAGE_ADAPTER
    value: github
  - key: GITHUB_STORAGE_REPO
    sync: false
  - key: GITHUB_STORAGE_TOKEN
    sync: false

  # Anthropic (handover.md task #6, task #19f): the Telegram MTProto cold-
  # storage archive no longer runs inside this container. It used to be a
  # peer process supervised by s6 (docker/rootfs/etc/services.d/mtproto-worker/,
  # removed in task #19f); it now runs as a one-shot script on a GitHub
  # Actions schedule instead (.github/workflows/mtproto_archive.yml), so
  # MTPROTO_WORKER_URL, MTPROTO_WORKER_SHARED_SECRET and all four
  # TELEGRAM_* vars are gone from here — they live as GitHub Actions repo
  # secrets now (see mtproto-worker/README.md "Setup"), and Rails never
  # talks to Telegram or to a worker process directly. This flag is the
  # only piece that stays: it gates Api::MtprotoArchiveController#candidates
  # (task #19f), independent of whether the GitHub Actions schedule itself
  # is enabled — flip it to true once the Actions secrets above are set.
  - key: MTPROTO_ARCHIVE_ENABLED
    value: false
